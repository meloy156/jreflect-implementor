name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile sources
        run: javac -cp "lib/*" -d out -sourcepath src   src/Implementor.java

      - name: Verify generated classes
        run: |
          test -f out/Implementor.class
          test -f out/collector/MethodCollector.class
          test -f out/collector/ConstructorCollector.class
          test -f out/generator/MethodGenerator.class
          test -f out/generator/ConstructorGenerator.class
          test -f out/validator/MethodValidator.class
          test -f out/validator/TokenValidator.class
          test -f out/util/HeadBuilder.class
          test -f out/util/OverrideResolver.class
          test -f out/util/TypeUtils.class
          echo "All classes compiled successfully"
